[project]
name = "sync-all-my-ftp-accounts"
version = "0.1.0"
description = "Sync stored FTP accounts between WinSCP, FileZilla, Notepad++ NppFTP and fman"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pick[blessed]>=2.6.0",
    "pycryptodome>=4.0.1",
]

[project.scripts]
ftp-sync = "ftp_sync.main:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftp_sync"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pick", "Crypto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
